name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: swift-format
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: |
          xcrun swift-format lint --recursive --strict \
            SpatiumDDI/SpatiumDDI SpatiumDDI/SpatiumDDITests SpatiumDDI/SpatiumDDIUITests

  test:
    name: Build & test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # The runner's simulator line-up changes with the Xcode image, so pick a
      # device that actually exists rather than pinning a model name.
      - name: Choose a simulator
        id: sim
        run: |
          destination=$(./scripts/pick-simulator.py)
          echo "destination=$destination" >> "$GITHUB_OUTPUT"

      # Brings up the self-signed stub control plane, runs the suite against a
      # real TLS handshake, then tears it down. Without the stub the trust tests
      # skip, and the run would look green while the security-critical
      # assertions never executed.
      - name: Run tests against the stub control plane
        env:
          SPATIUM_TEST_DESTINATION: ${{ steps.sim.outputs.destination }}
          SPATIUM_TEST_EXTRA_ARGS: -resultBundlePath ${{ runner.temp }}/TestResults.xcresult
        run: ./scripts/dev-control-plane.sh test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore
