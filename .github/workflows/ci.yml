name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: swift-format
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: |
          xcrun swift-format lint --recursive --strict \
            SpatiumDDI/SpatiumDDI SpatiumDDI/SpatiumDDITests SpatiumDDI/SpatiumDDIUITests

  test:
    name: Build & test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # The runner's simulator line-up changes with the Xcode image, so pick a
      # device that actually exists rather than pinning a model name.
      - name: Choose a simulator
        id: sim
        run: |
          destination=$(xcrun simctl list devices available --json | python3 -c '
import json, sys
data = json.load(sys.stdin)["devices"]
best = None
for runtime, devices in data.items():
    if "iOS" not in runtime:
        continue
    for device in devices:
        if device.get("isAvailable") and "iPhone" in device["name"]:
            version = runtime.rsplit(".", 1)[-1]
            if best is None or version > best[0]:
                best = (version, device["udid"], device["name"])
if best is None:
    sys.exit("no iPhone simulator available on this runner")
sys.stderr.write("using %s (%s)\n" % (best[2], best[0]))
print("platform=iOS Simulator,id=%s" % best[1])
')
          echo "destination=$destination" >> "$GITHUB_OUTPUT"
          echo "Using $destination"

      # Brings up the self-signed stub control plane, runs the suite against a
      # real TLS handshake, then tears it down. Without the stub the trust tests
      # skip, and the run would look green while the security-critical
      # assertions never executed.
      - name: Run tests against the stub control plane
        env:
          SPATIUM_TEST_DESTINATION: ${{ steps.sim.outputs.destination }}
          SPATIUM_TEST_EXTRA_ARGS: -resultBundlePath ${{ runner.temp }}/TestResults.xcresult
        run: ./scripts/dev-control-plane.sh test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/TestResults.xcresult
          retention-days: 7
          if-no-files-found: ignore
