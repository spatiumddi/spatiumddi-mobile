name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catches newly disclosed advisories against unchanged code.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  # Superseded PR pushes are worth cancelling. A push to main and the weekly
  # schedule share a ref, so cancelling those would leave the default branch
  # with no completed scan for the commit that is actually deployed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      # Secrets and misconfiguration are what matter here today. Dependency
      # scanning becomes meaningful once Package.resolved exists.
      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Upload results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy

      # Secrets are the one class worth breaking the build over: a leaked token
      # in a public repo is compromised the moment it is pushed.
      - name: Fail on exposed secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: "1"

  codeql:
    name: CodeQL
    runs-on: macos-latest
    # CodeQL instruments the Swift compile, so it is roughly triple a plain
    # build — and the app is now big enough that 60 minutes was a coin flip.
    #
    # Measured, not guessed. Before the parity work landed (#31) this job took
    # 39-41 minutes. That change added ~5,300 lines of Swift and 46 generated
    # API operations, taking `Types.swift` from 2.1MB to 2.8MB, and the job
    # went to 50-61 minutes: two of the four runs after it were cancelled on
    # the hour while the other two finished at 46 and 50. A cap the job lands
    # either side of is worse than no cap, because a cancelled security scan
    # reads as a failed one and people learn to merge past it.
    #
    # 90 leaves real headroom while still catching a genuinely wedged job.
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift
          queries: security-extended

      - name: Build
        run: |
          xcodebuild -project SpatiumDDI/SpatiumDDI.xcodeproj -scheme SpatiumDDI \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            CODE_SIGNING_ALLOWED=NO build

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:swift
