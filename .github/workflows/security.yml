name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catches newly disclosed advisories against unchanged code.
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  # Superseded PR pushes are worth cancelling. A push to main and the weekly
  # schedule share a ref, so cancelling those would leave the default branch
  # with no completed scan for the commit that is actually deployed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  trivy:
    name: Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      # Secrets and misconfiguration are what matter here today. Dependency
      # scanning becomes meaningful once Package.resolved exists.
      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Upload results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy.sarif
          category: trivy

      # Secrets are the one class worth breaking the build over: a leaked token
      # in a public repo is compromised the moment it is pushed.
      - name: Fail on exposed secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: "1"

  codeql:
    name: CodeQL
    runs-on: macos-latest
    # 60 minutes used to be enough and stopped being; 90 is headroom, not a
    # target. What the job actually spends its time on is below.
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: swift
          queries: security-extended

      # `ONLY_ACTIVE_ARCH=YES` is the whole point of this invocation, and it is
      # worth the paragraph because the default is quietly enormous here.
      #
      # This project builds its API client with the swift-openapi-generator
      # *build-tool plugin*, so a build has to compile that plugin — and its
      # dependency tree: OpenAPIKit, swift-collections, argument-parser, Yams,
      # numerics, algorithms — as host tools for macOS, before it compiles a
      # line of the app. Without this flag Xcode builds those host tools for
      # both arm64 and x86_64.
      #
      # Measured on a timed-out run: 1,064 Swift compile units, split exactly
      # 532/532 across the two architectures, of which 24 were the app target
      # and 14 were SpatiumAPI. CodeQL instruments all of it, so ~97% of a
      # 90-minute security scan was the code generator, compiled twice, to
      # analyse an iOS app.
      #
      # Building host tools for the runner's own architecture only is the
      # correct behaviour regardless; it costs no analysis coverage, because
      # the second slice is the same source compiled again.
      - name: Build
        run: |
          xcodebuild -project SpatiumDDI/SpatiumDDI.xcodeproj -scheme SpatiumDDI \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO build

      - name: Analyze
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:swift
